<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0d10;
      --border:   rgba(255, 255, 255, 0.06);
      --text:     #e2e2e6;
      --sub:      #6b6b78;
      --sub-lt:   #8b8b98;
      --accent:   #7b7cf8;
      --green:    #3ecf8e;
      --red:      #f87171;
      --user-bg:  #141419;
      --code-bg:  rgba(255, 255, 255, 0.06);
      --max-w:    660px;
      --font:     'Inter', -apple-system, sans-serif;
      --mono:     'JetBrains Mono', 'Fira Code', monospace;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Page ─────────────────────────────────────── */
    .page {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Header ───────────────────────────────────── */
    .header {
      flex-shrink: 0;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .online {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 400;
      color: var(--sub-lt);
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--green);
      animation: dot-fade 3s ease-in-out infinite;
    }
    @keyframes dot-fade {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.45; }
    }

    .clear-btn {
      background: none;
      border: none;
      color: var(--sub);
      font-size: 11.5px;
      font-family: var(--font);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      letter-spacing: 0.01em;
      transition: color 0.15s;
    }
    .clear-btn:hover { color: var(--text); }

    /* ── Messages ─────────────────────────────────── */
    .messages {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 3px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.07);
      border-radius: 3px;
    }

    .msgs-inner {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 48px 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 36px;
    }

    /* ── Welcome ──────────────────────────────────── */
    .welcome {
      padding: 56px 0 12px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0;
      animation: appear 0.45s ease-out both;
    }

    .welcome-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
      opacity: 0.8;
    }

    .welcome h2 {
      font-size: 26px;
      font-weight: 300;
      letter-spacing: -0.035em;
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .welcome p {
      font-size: 13.5px;
      color: var(--sub-lt);
      line-height: 1.65;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 28px;
    }

    .chip {
      padding: 5px 11px;
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 12px;
      color: var(--sub-lt);
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      user-select: none;
    }
    .chip:hover {
      color: var(--text);
      border-color: rgba(255,255,255,0.13);
    }

    /* ── Turn ─────────────────────────────────────── */
    .turn {
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: appear 0.3s ease-out both;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── User message ─────────────────────────────── */
    .user-msg {
      align-self: flex-end;
      max-width: 78%;
      padding: 10px 14px;
      background: var(--user-bg);
      border: 1px solid rgba(255,255,255,0.055);
      border-radius: 11px;
      border-bottom-right-radius: 3px;
      font-size: 14.5px;
      line-height: 1.65;
      color: var(--text);
      white-space: pre-wrap;
    }

    /* ── Agent section ────────────────────────────── */
    .agent-section {
      align-self: flex-start;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ── Thinking ─────────────────────────────────── */
    .thinking {
      display: flex;
      gap: 4px;
      align-items: center;
      height: 20px;
    }
    .t-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--sub);
      animation: t-bounce 1.5s ease-in-out infinite;
    }
    .t-dot:nth-child(2) { animation-delay: 0.15s; }
    .t-dot:nth-child(3) { animation-delay: 0.30s; }
    @keyframes t-bounce {
      0%, 60%, 100% { transform: translateY(0);    opacity: 0.3; }
      30%            { transform: translateY(-4px); opacity: 1;   }
    }

    /* ── Tool line ────────────────────────────────── */
    .tool-line {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--sub);
      line-height: 1;
    }

    .t-pip {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .t-pip.running {
      background: var(--accent);
      animation: pip-pulse 1.1s ease-in-out infinite;
    }
    .t-pip.done { background: var(--green); }
    @keyframes pip-pulse {
      0%, 100% { opacity: 1;   transform: scale(1);   }
      50%       { opacity: 0.3; transform: scale(0.65); }
    }

    .tool-fn   { color: var(--sub-lt); }
    .tool-args { color: var(--sub);    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 340px; }
    .tool-st   { color: var(--sub);    transition: color 0.3s; }
    .tool-st.done { color: var(--green); }

    /* ── Agent response text ──────────────────────── */
    .agent-text {
      font-size: 14.5px;
      line-height: 1.78;
      color: var(--text);
    }

    /* streaming cursor */
    .cursor {
      display: inline-block;
      width: 1.5px;
      height: 1em;
      background: var(--sub-lt);
      margin-left: 1px;
      vertical-align: text-bottom;
      border-radius: 1px;
      animation: cur-blink 0.9s step-end infinite;
    }
    @keyframes cur-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* ── Timestamp ────────────────────────────────── */
    .ts {
      font-size: 10px;
      color: var(--sub);
      letter-spacing: 0.01em;
    }
    .ts.right { align-self: flex-end; }
    .ts.left  { align-self: flex-start; }

    /* ── Error ────────────────────────────────────── */
    .error-text {
      font-size: 13px;
      color: var(--red);
    }

    /* ── Markdown ─────────────────────────────────── */
    .md p            { margin-bottom: 10px; }
    .md p:last-child { margin-bottom: 0; }
    .md h1, .md h2, .md h3 {
      font-weight: 500;
      margin: 18px 0 6px;
      letter-spacing: -0.02em;
    }
    .md h1 { font-size: 18px; }
    .md h2 { font-size: 15px; }
    .md h3 { font-size: 13.5px; color: var(--sub-lt); }
    .md ul, .md ol { padding-left: 18px; margin: 8px 0; }
    .md li { margin-bottom: 5px; line-height: 1.65; }
    .md code {
      font-family: var(--mono);
      font-size: 12.5px;
      background: var(--code-bg);
      padding: 1px 5px;
      border-radius: 3px;
    }
    .md pre {
      background: rgba(0,0,0,0.28);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 14px;
      overflow-x: auto;
      margin: 12px 0;
    }
    .md pre code { background: none; padding: 0; font-size: 12px; }
    .md a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgba(123,124,248,0.28);
    }
    .md strong { font-weight: 500; }
    .md em { color: var(--sub-lt); font-style: italic; }
    .md blockquote {
      border-left: 2px solid var(--border);
      padding-left: 14px;
      color: var(--sub-lt);
      margin: 10px 0;
    }
    .md hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 14px 0;
    }
    .md table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .md th, .md td {
      padding: 8px 12px;
      border: 1px solid var(--border);
      text-align: left;
    }
    .md th { font-weight: 500; color: var(--sub-lt); }

    /* ── Input bar ────────────────────────────────── */
    .input-bar {
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      padding: 14px 24px 20px;
    }

    .input-inner {
      max-width: var(--max-w);
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: rgba(255,255,255,0.025);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px 12px;
      transition: border-color 0.2s;
    }
    .input-inner:focus-within {
      border-color: rgba(123,124,248,0.32);
    }

    #chat-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.6;
      resize: none;
      max-height: 120px;
      overflow-y: auto;
      caret-color: var(--accent);
    }
    #chat-input::placeholder { color: var(--sub); }
    #chat-input::-webkit-scrollbar { width: 0; }

    .send-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: none;
      flex-shrink: 0;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.82;
      transition: opacity 0.15s, transform 0.15s;
    }
    .send-btn:hover:not(:disabled)  { opacity: 1; transform: translateY(-1px); }
    .send-btn:active:not(:disabled) { transform: none; }
    .send-btn:disabled { opacity: 0.22; cursor: not-allowed; }

    .hint {
      max-width: var(--max-w);
      margin: 7px auto 0;
      font-size: 10.5px;
      color: var(--sub);
      text-align: center;
      letter-spacing: 0.01em;
    }

    /* ── Mobile ───────────────────────────────────── */
    @media (max-width: 600px) {
      .header  { padding: 0 16px; }
      .msgs-inner { padding: 28px 16px 20px; }
      .input-bar  { padding: 10px 16px 18px; }
      .user-msg   { max-width: 88%; }
    }
  </style>
</head>
<body>
<div class="page">

  <!-- Header -->
  <header class="header">
    <div class="brand">
      AgentAI
      <div class="online">
        <div class="dot"></div>
        online
      </div>
    </div>
    <button class="clear-btn" id="clear-btn">Clear</button>
  </header>

  <!-- Messages -->
  <main class="messages" id="messages">
    <div class="msgs-inner" id="msgs-inner">
      <div class="welcome" id="welcome">
        <div class="welcome-label">Agent</div>
        <h2>How can I help?</h2>
        <p>I can search the web, run calculations,<br>and answer your questions.</p>
        <div class="chips">
          <div class="chip suggestion">What's today's date?</div>
          <div class="chip suggestion">Search for AI news</div>
          <div class="chip suggestion">What is 347 × 29?</div>
          <div class="chip suggestion">Latest space discoveries</div>
        </div>
      </div>
    </div>
  </main>

  <!-- Input -->
  <div class="input-bar">
    <div class="input-inner">
      <textarea id="chat-input" placeholder="Ask anything…" rows="1"></textarea>
      <button class="send-btn" id="send-btn" aria-label="Send">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"/>
          <polyline points="5 12 12 5 19 12"/>
        </svg>
      </button>
    </div>
    <p class="hint">Enter to send &nbsp;·&nbsp; Shift+Enter for new line</p>
  </div>

</div>

<script>
  marked.setOptions({ breaks: true, gfm: true });

  const messagesEl = document.getElementById('messages');
  const innerEl    = document.getElementById('msgs-inner');
  const inputEl    = document.getElementById('chat-input');
  const sendBtn    = document.getElementById('send-btn');
  const clearBtn   = document.getElementById('clear-btn');
  const welcomeEl  = document.getElementById('welcome');

  let isStreaming = false;

  // ── Auto-resize ──────────────────────────────────
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  sendBtn.addEventListener('click', sendMessage);

  // ── Suggestions ──────────────────────────────────
  document.querySelectorAll('.suggestion').forEach(el => {
    el.addEventListener('click', () => {
      inputEl.value = el.textContent.trim();
      inputEl.dispatchEvent(new Event('input'));
      sendMessage();
    });
  });

  // ── Clear ────────────────────────────────────────
  clearBtn.addEventListener('click', () => {
    innerEl.innerHTML = '';
    welcomeEl.style.display = '';
    innerEl.appendChild(welcomeEl);
  });

  // ── Utilities ────────────────────────────────────
  const scrollBottom = () =>
    requestAnimationFrame(() => { messagesEl.scrollTop = messagesEl.scrollHeight; });

  const now = () =>
    new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  function hideWelcome() { welcomeEl.style.display = 'none'; }

  // ── DOM builders ─────────────────────────────────
  function createTurn() {
    const el = document.createElement('div');
    el.className = 'turn';
    innerEl.appendChild(el);
    return el;
  }

  function appendUserMsg(turn, text) {
    hideWelcome();
    const msg = document.createElement('div');
    msg.className = 'user-msg';
    msg.textContent = text;

    const ts = document.createElement('div');
    ts.className = 'ts right';
    ts.textContent = now();

    turn.append(msg, ts);
    scrollBottom();
  }

  function createAgentSection(turn) {
    const el = document.createElement('div');
    el.className = 'agent-section';
    turn.appendChild(el);
    scrollBottom();
    return el;
  }

  function createThinking(section) {
    const el = document.createElement('div');
    el.className = 'thinking';
    for (let i = 0; i < 3; i++) {
      const d = document.createElement('div');
      d.className = 't-dot';
      el.appendChild(d);
    }
    section.appendChild(el);
    scrollBottom();
    return el;
  }

  function createToolLine(section, name, input) {
    const line = document.createElement('div');
    line.className = 'tool-line';

    const pip = document.createElement('div');
    pip.className = 't-pip running';

    const fn = document.createElement('span');
    fn.className = 'tool-fn';
    fn.textContent = name;

    const argsStr = Object.entries(input)
      .map(([k, v]) => `${k}=${JSON.stringify(v)}`)
      .join(', ');
    const args = document.createElement('span');
    args.className = 'tool-args';
    args.textContent = argsStr ? `(${argsStr})` : '()';

    const st = document.createElement('span');
    st.className = 'tool-st';
    st.textContent = '· running';

    line.append(pip, fn, args, st);
    section.appendChild(line);
    scrollBottom();
    return { pip, st };
  }

  function markToolsDone(refs) {
    for (const { pip, st } of Object.values(refs)) {
      pip.className = 't-pip done';
      st.className  = 'tool-st done';
      st.textContent = '· done';
    }
  }

  function createAgentText(section) {
    const el = document.createElement('div');
    el.className = 'agent-text';

    const content = document.createElement('span');
    content.className = 'md';

    const cursor = document.createElement('span');
    cursor.className = 'cursor';

    el.append(content, cursor);
    section.appendChild(el);
    scrollBottom();
    return { el, content, cursor };
  }

  // ── Send ─────────────────────────────────────────
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isStreaming) return;

    isStreaming = true;
    sendBtn.disabled = true;
    inputEl.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    const turn     = createTurn();
    appendUserMsg(turn, text);
    const section  = createAgentSection(turn);
    const thinking = createThinking(section);

    let rawText    = '';
    let agentEl    = null;
    let toolRefs   = {};
    let firstToken = true;

    try {
      const resp = await fetch('/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });

      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

      const reader  = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer    = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          let data;
          try { data = JSON.parse(line.slice(6)); } catch { continue; }

          if (data.type === 'tool_start') {
            if (thinking.parentNode) thinking.remove();
            const refs = createToolLine(section, data.name, data.input || {});
            toolRefs[data.name + '_' + Date.now()] = refs;
          }

          else if (data.type === 'token') {
            if (firstToken) {
              firstToken = false;
              if (thinking.parentNode) thinking.remove();
              markToolsDone(toolRefs);
              agentEl = createAgentText(section);
            }
            rawText += data.content;
            agentEl.content.textContent = rawText;
            scrollBottom();
          }

          else if (data.type === 'end') {
            if (agentEl) {
              agentEl.cursor.remove();
              agentEl.content.innerHTML = marked.parse(rawText);
            } else {
              if (thinking.parentNode) thinking.remove();
            }
            const ts = document.createElement('div');
            ts.className = 'ts left';
            ts.textContent = now();
            section.appendChild(ts);
            scrollBottom();
          }

          else if (data.type === 'error') {
            if (thinking.parentNode) thinking.remove();
            const err = document.createElement('div');
            err.className = 'error-text';
            err.textContent = `Error: ${data.message}`;
            section.appendChild(err);
            scrollBottom();
          }
        }
      }
    } catch (e) {
      if (thinking.parentNode) thinking.remove();
      if (agentEl) agentEl.cursor.remove();
      const err = document.createElement('div');
      err.className = 'error-text';
      err.textContent = e.name === 'AbortError' ? 'Connection closed.' : `Error: ${e.message}`;
      section.appendChild(err);
      scrollBottom();
    } finally {
      isStreaming = false;
      sendBtn.disabled = false;
      inputEl.disabled = false;
      inputEl.focus();
    }
  }

  inputEl.focus();
</script>
</body>
</html>
