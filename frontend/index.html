<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    /* ─── Reset ─────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:              #060609;
      --glass:           rgba(11, 11, 22, 0.78);
      --glass-border:    rgba(255,255,255,0.07);
      --glass-hi:        rgba(255,255,255,0.03);
      --text:            #e2e8f0;
      --muted:           #64748b;
      --purple:          #7c3aed;
      --purple-lt:       #a78bfa;
      --cyan:            #06b6d4;
      --pink:            #ec4899;
      --indigo:          #6366f1;
      --green:           #10b981;
      --red:             #ef4444;
      --user-grad:       linear-gradient(135deg, #7c3aed 0%, #6366f1 100%);
      --agent-bg:        rgba(255,255,255,0.04);
      --tool-bg:         rgba(6,182,212,0.07);
      --tool-border:     rgba(6,182,212,0.28);
      --input-bg:        rgba(255,255,255,0.04);
      --scrollbar:       rgba(255,255,255,0.09);
      --r-sm: 8px;  --r-md: 16px;  --r-lg: 24px;  --r-xl: 28px;
      --font: 'Inter', -apple-system, sans-serif;
      --mono: 'JetBrains Mono', 'Fira Code', monospace;
    }

    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Aurora background ──────────────────────── */
    .aurora {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0; overflow: hidden;
    }
    .orb {
      position: absolute; border-radius: 50%;
      filter: blur(90px); opacity: 0; will-change: transform;
      animation: orb-fade-in 2s ease-out forwards;
    }
    @keyframes orb-fade-in { to { opacity: var(--orb-opacity, 0.32); } }

    .orb-1 {
      --orb-opacity: 0.32;
      width: 650px; height: 650px;
      background: radial-gradient(circle, #7c3aed, transparent 70%);
      top: -220px; left: -80px;
      animation: orb-fade-in 2s ease-out forwards, float-1 22s ease-in-out 2s infinite;
    }
    .orb-2 {
      --orb-opacity: 0.28;
      width: 550px; height: 550px;
      background: radial-gradient(circle, #06b6d4, transparent 70%);
      bottom: -160px; right: -80px;
      animation: orb-fade-in 2.3s ease-out forwards, float-2 27s ease-in-out 2s infinite;
    }
    .orb-3 {
      --orb-opacity: 0.18;
      width: 420px; height: 420px;
      background: radial-gradient(circle, #ec4899, transparent 70%);
      top: 38%; right: 8%;
      animation: orb-fade-in 2.6s ease-out forwards, float-3 19s ease-in-out 2s infinite;
    }
    .orb-4 {
      --orb-opacity: 0.22;
      width: 380px; height: 380px;
      background: radial-gradient(circle, #6366f1, transparent 70%);
      bottom: 18%; left: 8%;
      animation: orb-fade-in 2.9s ease-out forwards, float-4 24s ease-in-out 2s infinite;
    }

    @keyframes float-1 {
      0%,100% { transform: translate(0,0) scale(1); }
      25%  { transform: translate(45px,55px) scale(1.06); }
      50%  { transform: translate(-25px,30px) scale(0.94); }
      75%  { transform: translate(18px,-38px) scale(1.03); }
    }
    @keyframes float-2 {
      0%,100% { transform: translate(0,0) scale(1); }
      30%  { transform: translate(-55px,-28px) scale(1.09); }
      60%  { transform: translate(28px,-52px) scale(0.91); }
      80%  { transform: translate(-18px,42px) scale(1.05); }
    }
    @keyframes float-3 {
      0%,100% { transform: translate(0,0) scale(1); }
      40%  { transform: translate(-38px,48px) scale(1.11); }
      70%  { transform: translate(52px,-28px) scale(0.89); }
    }
    @keyframes float-4 {
      0%,100% { transform: translate(0,0) scale(1); }
      50%  { transform: translate(58px,-38px) scale(1.07); }
    }

    /* ─── Layout ─────────────────────────────────── */
    .layout {
      position: relative; z-index: 1;
      height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }

    /* ─── Chat panel ─────────────────────────────── */
    .chat-panel {
      width: 100%; max-width: 820px;
      height: calc(100vh - 40px); max-height: 920px;
      display: flex; flex-direction: column;
      background: var(--glass);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1px solid var(--glass-border);
      border-radius: var(--r-xl);
      box-shadow:
        0 32px 80px rgba(0,0,0,0.65),
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 0 60px rgba(124,58,237,0.08);
      overflow: hidden;
      animation: panel-in 0.6s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes panel-in {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ─── Header ─────────────────────────────────── */
    .chat-header {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 26px;
      border-bottom: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.02);
    }
    .agent-info { display: flex; align-items: center; gap: 13px; }

    .avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      display: flex; align-items: center; justify-content: center;
      font-size: 19px; flex-shrink: 0;
      box-shadow: 0 0 0 2px rgba(124,58,237,0.25), 0 0 24px rgba(124,58,237,0.35);
      animation: avatar-pulse 4s ease-in-out infinite;
    }
    @keyframes avatar-pulse {
      0%,100% { box-shadow: 0 0 0 2px rgba(124,58,237,0.25), 0 0 24px rgba(124,58,237,0.35); }
      50%      { box-shadow: 0 0 0 2px rgba(6,182,212,0.3),   0 0 32px rgba(6,182,212,0.4); }
    }

    .agent-name { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
    .agent-status {
      display: flex; align-items: center; gap: 5px;
      font-size: 11.5px; color: var(--green); font-weight: 500; margin-top: 2px;
    }
    .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--green); box-shadow: 0 0 5px var(--green);
      animation: blink-dot 2.2s ease-in-out infinite;
    }
    @keyframes blink-dot {
      0%,100% { opacity: 1; } 50% { opacity: 0.55; transform: scale(0.8); }
    }

    .icon-btn {
      width: 34px; height: 34px;
      border-radius: var(--r-sm); border: 1px solid var(--glass-border);
      background: var(--glass-hi); color: var(--muted);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.07); color: var(--text); }

    /* ─── Messages ───────────────────────────────── */
    .messages {
      flex: 1; overflow-y: auto;
      padding: 28px 28px 16px;
      display: flex; flex-direction: column; gap: 18px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }

    /* ─── Welcome ────────────────────────────────── */
    .welcome {
      text-align: center; padding: 48px 20px;
      color: var(--muted); font-size: 14px; line-height: 1.65;
      animation: fade-in 0.9s ease-out both;
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .welcome-icon {
      font-size: 52px; margin-bottom: 18px; display: block;
      filter: drop-shadow(0 0 22px rgba(124,58,237,0.55));
      animation: icon-float 3.5s ease-in-out infinite;
    }
    @keyframes icon-float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-9px); }
    }
    .welcome h2 {
      font-size: 21px; font-weight: 600; color: var(--text);
      margin-bottom: 9px; letter-spacing: -0.025em;
    }
    .suggestions {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center; margin-top: 22px;
    }
    .suggestion {
      padding: 7px 14px; border-radius: 100px;
      border: 1px solid var(--glass-border);
      background: var(--glass-hi); color: var(--muted);
      font-size: 12px; cursor: pointer; transition: all 0.2s; user-select: none;
    }
    .suggestion:hover {
      border-color: rgba(124,58,237,0.45); color: var(--text);
      background: rgba(124,58,237,0.09);
      transform: translateY(-1px);
    }

    /* ─── Message rows ───────────────────────────── */
    .message-row {
      display: flex; flex-direction: column;
      animation: msg-in 0.38s cubic-bezier(0.25,0.46,0.45,0.94) both;
    }
    .message-row.user  { align-items: flex-end; }
    .message-row.agent { align-items: flex-start; }

    @keyframes msg-in {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade-in {
      from { opacity: 0; } to { opacity: 1; }
    }

    /* ─── Bubbles ────────────────────────────────── */
    .bubble {
      max-width: 84%;
      padding: 13px 17px;
      border-radius: var(--r-md);
      font-size: 14.5px; line-height: 1.7;
    }
    .bubble.user {
      background: var(--user-grad); color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 22px rgba(124,58,237,0.32);
    }
    .bubble.agent {
      background: var(--agent-bg);
      border: 1px solid var(--glass-border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }
    .bubble.agent.streaming {
      border-color: rgba(124,58,237,0.25);
      box-shadow: 0 0 18px rgba(124,58,237,0.07);
    }

    /* streaming cursor */
    .cursor {
      display: inline-block; width: 2px; height: 1em;
      background: var(--purple-lt); margin-left: 2px;
      vertical-align: text-bottom; border-radius: 1px;
      animation: blink 0.85s step-end infinite;
    }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

    /* ─── Thinking indicator ─────────────────────── */
    .thinking {
      display: flex; align-items: center; gap: 5px;
      padding: 13px 17px;
      background: var(--agent-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--r-md); border-bottom-left-radius: 4px;
      width: fit-content;
    }
    .thinking-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.4s ease-in-out infinite;
    }
    .thinking-dot:nth-child(2) { animation-delay: 0.18s; }
    .thinking-dot:nth-child(3) { animation-delay: 0.36s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); opacity: 0.4; }
      30%          { transform: translateY(-6px); opacity: 1; }
    }

    /* ─── Tool cards ─────────────────────────────── */
    .tool-card {
      max-width: 84%;
      background: var(--tool-bg);
      border: 1px solid var(--tool-border);
      border-radius: var(--r-md);
      padding: 10px 15px;
      display: flex; align-items: flex-start; gap: 11px;
      animation: msg-in 0.3s cubic-bezier(0.25,0.46,0.45,0.94) both;
      position: relative; overflow: hidden;
    }
    .tool-card.active::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(
        90deg, transparent 0%, rgba(6,182,212,0.07) 50%, transparent 100%
      );
      background-size: 200% 100%;
      animation: shimmer 1.8s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%   { background-position: -200% center; }
      100% { background-position:  200% center; }
    }

    .tool-icon {
      width: 30px; height: 30px; border-radius: 9px;
      background: rgba(6,182,212,0.15);
      border: 1px solid rgba(6,182,212,0.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0; position: relative;
    }
    .tool-icon.spinning::before {
      content: '';
      position: absolute; inset: -3px;
      border-radius: 11px;
      border: 2px solid transparent;
      border-top-color: var(--cyan);
      border-right-color: rgba(6,182,212,0.3);
      animation: spin 0.8s linear infinite;
      z-index: 1;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .tool-details { flex: 1; min-width: 0; }
    .tool-name {
      font-size: 12px; font-weight: 600; color: var(--cyan);
      font-family: var(--mono); display: flex; align-items: center; gap: 6px;
      margin-bottom: 2px;
    }
    .tool-badge {
      font-size: 10px; font-family: var(--font); font-weight: 500;
      padding: 1px 6px; border-radius: 100px;
    }
    .tool-badge.running { background: rgba(6,182,212,0.15); color: var(--cyan); }
    .tool-badge.done    { background: rgba(16,185,129,0.15); color: var(--green); }
    .tool-args {
      font-size: 11px; color: var(--muted); font-family: var(--mono);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ─── Timestamp ──────────────────────────────── */
    .ts { font-size: 10.5px; color: var(--muted); margin-top: 5px; padding: 0 3px; }

    /* ─── Error ──────────────────────────────────── */
    .error-bubble {
      max-width: 84%;
      background: rgba(239,68,68,0.09); border: 1px solid rgba(239,68,68,0.3);
      border-radius: var(--r-md); padding: 12px 16px;
      font-size: 13.5px; color: #fca5a5;
    }

    /* ─── Markdown content ───────────────────────── */
    .md p            { margin-bottom: 9px; }
    .md p:last-child { margin-bottom: 0; }
    .md h1,.md h2,.md h3 { font-weight: 600; margin: 14px 0 6px; letter-spacing: -0.02em; }
    .md h1 { font-size: 17px; } .md h2 { font-size: 15px; } .md h3 { font-size: 14px; }
    .md ul,.md ol   { padding-left: 20px; margin: 8px 0; }
    .md li          { margin-bottom: 4px; }
    .md code {
      font-family: var(--mono); font-size: 12.5px;
      background: rgba(255,255,255,0.09); padding: 1px 5px; border-radius: 4px;
    }
    .md pre {
      background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px; padding: 14px; overflow-x: auto; margin: 10px 0;
    }
    .md pre code { background: transparent; padding: 0; font-size: 12px; }
    .md a         { color: var(--purple-lt); }
    .md strong    { font-weight: 600; }
    .md em        { font-style: italic; color: rgba(226,232,240,0.8); }
    .md blockquote {
      border-left: 2px solid var(--purple); padding-left: 12px;
      color: var(--muted); margin: 8px 0;
    }
    .md hr { border: none; border-top: 1px solid var(--glass-border); margin: 12px 0; }
    .md table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .md th,.md td { padding: 7px 11px; border: 1px solid var(--glass-border); text-align: left; }
    .md th { background: rgba(255,255,255,0.04); font-weight: 600; }

    /* ─── Input area ─────────────────────────────── */
    .input-area {
      flex-shrink: 0;
      padding: 18px 26px 22px;
      border-top: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.015);
    }
    .input-wrapper {
      display: flex; align-items: flex-end; gap: 11px;
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--r-lg);
      padding: 11px 15px;
      transition: all 0.25s;
    }
    .input-wrapper:focus-within {
      border-color: rgba(124,58,237,0.45);
      box-shadow: 0 0 0 4px rgba(124,58,237,0.07), 0 4px 24px rgba(0,0,0,0.25);
      background: rgba(124,58,237,0.03);
    }
    #chat-input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-family: var(--font); font-size: 14.5px;
      line-height: 1.6; resize: none; max-height: 120px; overflow-y: auto;
      caret-color: var(--purple-lt);
    }
    #chat-input::placeholder { color: var(--muted); }
    #chat-input::-webkit-scrollbar { width: 3px; }
    #chat-input::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }

    .send-btn {
      width: 40px; height: 40px; border-radius: 12px;
      border: none; flex-shrink: 0;
      background: linear-gradient(135deg, #7c3aed, #6366f1);
      color: #fff; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(124,58,237,0.38);
    }
    .send-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(124,58,237,0.52); }
    .send-btn:active:not(:disabled) { transform: translateY(0); }
    .send-btn:disabled { opacity: 0.38; cursor: not-allowed; box-shadow: none; }

    .hint {
      text-align: center; margin-top: 9px;
      font-size: 11px; color: var(--muted);
      letter-spacing: 0.01em;
    }

    /* ─── Responsive ─────────────────────────────── */
    @media (max-width: 600px) {
      .layout { padding: 0; }
      .chat-panel { border-radius: 0; height: 100vh; max-height: none; }
      .messages { padding: 16px; }
      .input-area { padding: 12px 14px 18px; }
      .bubble, .tool-card { max-width: 92%; }
    }
  </style>
</head>
<body>

<!-- ── Aurora ──────────────────────────────────── -->
<div class="aurora">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
</div>

<div class="layout">
  <div class="chat-panel">

    <!-- Header -->
    <header class="chat-header">
      <div class="agent-info">
        <div class="avatar">🤖</div>
        <div>
          <div class="agent-name">AgentAI</div>
          <div class="agent-status">
            <div class="status-dot"></div>
            Online
          </div>
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="icon-btn" id="clear-btn" title="Clear chat">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
            <path d="M10 11v6M14 11v6"/>
            <path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Messages -->
    <main class="messages" id="messages">
      <div class="welcome" id="welcome">
        <span class="welcome-icon">✦</span>
        <h2>Hello, I'm AgentAI</h2>
        <p>I can search the web, do math, and answer questions in real time.</p>
        <div class="suggestions">
          <div class="suggestion">What's today's date?</div>
          <div class="suggestion">Search for AI news</div>
          <div class="suggestion">What is 347 × 29?</div>
          <div class="suggestion">Latest space discoveries</div>
        </div>
      </div>
    </main>

    <!-- Input -->
    <footer class="input-area">
      <div class="input-wrapper">
        <textarea id="chat-input" placeholder="Ask me anything…" rows="1"></textarea>
        <button class="send-btn" id="send-btn" aria-label="Send">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="hint">Enter to send &nbsp;·&nbsp; Shift+Enter for new line</div>
    </footer>

  </div>
</div>

<script>
  // ── Marked config ──────────────────────────────────────────────────────
  marked.setOptions({ breaks: true, gfm: true });

  // ── DOM refs ───────────────────────────────────────────────────────────
  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('chat-input');
  const sendBtn    = document.getElementById('send-btn');
  const clearBtn   = document.getElementById('clear-btn');
  const welcomeEl  = document.getElementById('welcome');

  let isStreaming = false;

  // ── Tool → emoji map ───────────────────────────────────────────────────
  const toolEmoji = {
    web_search: '🔍', add: '➕', multiply: '✖️',
    divide: '➗', get_today: '📅',
  };
  const toolEmoji$ = n => toolEmoji[n] ?? '⚙️';

  // ── Auto-resize textarea ───────────────────────────────────────────────
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  // ── Keyboard: Enter sends, Shift+Enter inserts newline ─────────────────
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  sendBtn.addEventListener('click', sendMessage);

  // ── Suggestion chips ───────────────────────────────────────────────────
  document.querySelectorAll('.suggestion').forEach(el => {
    el.addEventListener('click', () => {
      inputEl.value = el.textContent.trim();
      inputEl.dispatchEvent(new Event('input'));
      sendMessage();
    });
  });

  // ── Clear chat ─────────────────────────────────────────────────────────
  clearBtn.addEventListener('click', () => {
    messagesEl.innerHTML = '';
    welcomeEl.style.display = '';
    welcomeEl.style.flex = '';
    messagesEl.appendChild(welcomeEl);
  });

  // ── Helpers ────────────────────────────────────────────────────────────
  const scrollBottom = () =>
    requestAnimationFrame(() => { messagesEl.scrollTop = messagesEl.scrollHeight; });

  const now = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  function hideWelcome() {
    welcomeEl.style.flex = '0';
    welcomeEl.style.padding = '0';
    welcomeEl.style.display = 'none';
  }

  function appendUserMessage(text) {
    hideWelcome();
    const row = document.createElement('div');
    row.className = 'message-row user';

    const bubble = document.createElement('div');
    bubble.className = 'bubble user';
    bubble.textContent = text;

    const ts = document.createElement('div');
    ts.className = 'ts';
    ts.textContent = now();

    row.append(bubble, ts);
    messagesEl.appendChild(row);
    scrollBottom();
  }

  function createAgentRow() {
    const row = document.createElement('div');
    row.className = 'message-row agent';
    messagesEl.appendChild(row);
    scrollBottom();
    return row;
  }

  function createThinking(parent) {
    const el = document.createElement('div');
    el.className = 'thinking';
    for (let i = 0; i < 3; i++) {
      const d = document.createElement('div');
      d.className = 'thinking-dot';
      el.appendChild(d);
    }
    parent.appendChild(el);
    scrollBottom();
    return el;
  }

  function createToolCard(parent, name, input) {
    const card = document.createElement('div');
    card.className = 'tool-card active';

    const icon = document.createElement('div');
    icon.className = 'tool-icon spinning';
    icon.textContent = toolEmoji$(name);

    const details = document.createElement('div');
    details.className = 'tool-details';

    const nameLine = document.createElement('div');
    nameLine.className = 'tool-name';

    const nameSpan = document.createElement('span');
    nameSpan.textContent = name;

    const badge = document.createElement('span');
    badge.className = 'tool-badge running';
    badge.textContent = 'running';

    nameLine.append(nameSpan, badge);

    const argsEl = document.createElement('div');
    argsEl.className = 'tool-args';
    const argsStr = Object.entries(input).map(([k,v]) => `${k}=${JSON.stringify(v)}`).join(', ');
    argsEl.textContent = argsStr || '—';

    details.append(nameLine, argsEl);
    card.append(icon, details);
    parent.appendChild(card);
    scrollBottom();

    return { card, icon, badge };
  }

  function markToolsDone(toolRefs) {
    for (const { card, icon, badge } of Object.values(toolRefs)) {
      card.classList.remove('active');
      icon.classList.remove('spinning');
      badge.className = 'tool-badge done';
      badge.textContent = 'done ✓';
    }
  }

  function createAgentBubble(parent) {
    const bubble = document.createElement('div');
    bubble.className = 'bubble agent streaming';

    const content = document.createElement('div');
    content.className = 'md';

    const cursor = document.createElement('span');
    cursor.className = 'cursor';

    bubble.append(content, cursor);
    parent.appendChild(bubble);
    scrollBottom();
    return { bubble, content, cursor };
  }

  // ── Main send function ─────────────────────────────────────────────────
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isStreaming) return;

    isStreaming = true;
    sendBtn.disabled = true;
    inputEl.disabled = true;

    inputEl.value = '';
    inputEl.style.height = 'auto';

    appendUserMessage(text);

    const agentRow = createAgentRow();
    const thinking = createThinking(agentRow);

    let rawText    = '';
    let agentBubble = null;
    let toolRefs    = {};
    let firstToken  = true;

    try {
      const resp = await fetch('/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });

      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

      const reader  = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer    = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          let data;
          try { data = JSON.parse(line.slice(6)); } catch { continue; }

          if (data.type === 'tool_start') {
            if (thinking.parentNode) thinking.remove();
            const refs = createToolCard(agentRow, data.name, data.input || {});
            toolRefs[data.name + '_' + Date.now()] = refs;
          }

          else if (data.type === 'token') {
            if (firstToken) {
              firstToken = false;
              if (thinking.parentNode) thinking.remove();
              markToolsDone(toolRefs);
              agentBubble = createAgentBubble(agentRow);
            }
            rawText += data.content;
            agentBubble.content.textContent = rawText;
            scrollBottom();
          }

          else if (data.type === 'end') {
            if (agentBubble) {
              agentBubble.cursor.remove();
              agentBubble.bubble.classList.remove('streaming');
              agentBubble.content.innerHTML = marked.parse(rawText);
            } else {
              if (thinking.parentNode) thinking.remove();
            }
            const ts = document.createElement('div');
            ts.className = 'ts';
            ts.textContent = now();
            agentRow.appendChild(ts);
            scrollBottom();
          }

          else if (data.type === 'error') {
            if (thinking.parentNode) thinking.remove();
            const err = document.createElement('div');
            err.className = 'error-bubble';
            err.textContent = `Error: ${data.message}`;
            agentRow.appendChild(err);
            scrollBottom();
          }
        }
      }
    } catch (e) {
      if (thinking.parentNode) thinking.remove();
      if (agentBubble) {
        agentBubble.cursor.remove();
        agentBubble.bubble.classList.remove('streaming');
      }
      const err = document.createElement('div');
      err.className = 'error-bubble';
      err.textContent = e.name === 'AbortError' ? 'Connection closed.' : `Error: ${e.message}`;
      agentRow.appendChild(err);
      scrollBottom();
    } finally {
      isStreaming = false;
      sendBtn.disabled = false;
      inputEl.disabled = false;
      inputEl.focus();
    }
  }

  inputEl.focus();
</script>
</body>
</html>
